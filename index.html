<style>

  #buff{position:fixed;left:0;right:0;top:46px;text-align:center;font-weight:800;font-size:17px;color:#fff3a8;

  #msg{position:fixed;left:0;right:0;top:43%;text-align:center;font-weight:900;font-size:30px;color:#fff;

<script>
/* ============================================================
   1) 설정표 — 손맛은 여기 숫자만 바꾸면 됩니다
   ============================================================ */
const CONFIG = {
  speed: 7.5,        // 달리는 속도 (초당 미터)
  gravity: 32,       // 중력 (클수록 빨리 떨어짐)
  jumpPower: 11.5,   // 점프 힘 (클수록 높이 뜀)
  maxJumps: 2,       // 공중에서 몇 번까지 점프 (2 = 2단 점프)
  energyMax: 100,    // 에너지 통 크기
  drain: 3,          // 1초마다 줄어드는 에너지
  pitCost: 20,       // 구덩이에 빠지면 깎이는 에너지
  enemyCost: 15,     // 적에게 닿으면 깎이는 에너지
  potionGain: 25,    // 물약 하나가 채워주는 에너지
  stompGain: 6,      // 악당을 밟으면 차는 에너지 (큰 악당은 더 많이)
  respawnBack: 8,    // 실패하면 몇 미터 뒤에서 다시 시작
  laneWidth: 2,      // 한 칸 너비
  laneSpeed: 14,     // 옆 칸으로 옮겨가는 빠르기
  sideWidth: 5,      // 달리는 3칸 양옆에 붙은 나무 심는 땅의 너비
  islandDepth: 5,    // 하늘 섬의 두께
  shadows: true,     // 햇빛 그림자 켜기 (폰이 느리면 false)
  boxHeight: 2.4,    // 상자 바닥이 땅에서 떠 있는 높이
  bigScale: 1.45,    // 아이템 먹었을 때 커지는 배율
  enemySpeed: 1.5,   // 걸어오는 적의 빠르기
  stompBounce: 0.8,  // 적을 밟고 튀어 오르는 힘 (점프 힘의 배율)
  hitSafeTime: 1.5,  // 적에게 맞은 뒤 깜빡이며 안 맞는 시간(초)
  stepUp: 0.35,      // 이 높이까지는 턱을 그냥 올라감
  camBack: 8,        // 카메라가 캐릭터 뒤로 떨어진 거리
  camUp: 6,          // 카메라 높이
  camLookAhead: 9,   // 카메라가 캐릭터 앞 몇 미터를 보는지
};

/* ============================================================
   2) 스테이지 배치표
   ============================================================ */
// 땅 높이: [길이, 도착 높이]  앞 높이와 다르면 언덕. null = 3칸 전체 구멍(점프)
const LEVEL = [
  [16,0],[8,2],[6,2],[8,0],[8,0],[3,null],
  [10,0],[10,3],[8,3],[3,null],[6,3],[12,0],
  [8,0],[6,1.5],[3,null],[6,1.5],[6,0],
  [10,0],[10,4],[6,4],[14,0],[18,0],
];
// 칸별 구덩이: [시작 거리, 길이, 칸]  L=왼쪽 C=가운데 R=오른쪽
const PITS = [
  [20,4,'C'],[32,4,'LR'],[52,4,'CR'],[64,4,'LC'],[72,4,'C'],[88,4,'R'],[100,4,'CR'],
  [122,4,'LC'],[130,5,'R'],[138,4,'C'],[148,4,'LR'],[158,4,'C'],[164,4,'L'],
];
// 동전 길: [거리, 칸 번호]  0=왼쪽 1=가운데 2=오른쪽 — 그 거리부터 그 칸으로 이어짐
const COIN_PATH = [[4,1],[17,0],[28,1],[48,0],[60,2],[84,1],[97,0],[119,2],[129,1],[137,0],[146,1],[155,2],[166,1]];
// 아이템 상자: [거리, 칸 번호]
const BOXES = [[26,1],[84,1],[168,1]];
// 에너지 물약: [거리, 칸 번호]
const POTIONS = [[38,1],[70,2],[110,0],[150,1]];
// 별 동전(스테이지에 3개, 먹기 어려운 자리): [거리, 칸 번호, 땅에서 높이]
const BIG_COINS = [[44,2,0.9],[78.5,2,3.4],[160,0,0.9]];
// 동전 아치(점프해서 먹는 포물선): [가운데 거리, 반쪽 너비, 높이]
const COIN_ARCS = [];
// 담·허들(칸을 막는 블록. 점프해서 올라타거나 옆 칸으로 피함): [시작 거리, 길이, 칸, 높이]
const BLOCKS = [];
// 구간 표시: [시작 거리, 구간 종류]  terrain 지형 · enemy 악당 · mix 섞임 · rest 쉬기
const ZONES = [];
// 캐릭터: 적지 않은 값은 설정표 값을 그대로 씀
//   size 몸 크기 · wide/tall 옆·위 비율 · anim 발놀림 빠르기 · bob 달릴 때 통통 튀는 높이
//   jumpPower 점프 힘 · gravity 떨어지는 빠르기 · laneSpeed 옆 칸 이동 빠르기 · prop 달고 다니는 소품
const CHARS = [
  { name: '통통이', desc: '동글동글 · 통통 튀는 기본형',     color: 0xff5a4d, cap: 0x3d6bff, shape: 'box',
    size: 1.0,  wide: 1.15, tall: 0.95, anim: 1.0,  bob: 0.16 },
  { name: '풍선이', desc: '길쭉 · 3단 점프로 둥실둥실',     color: 0x4db8ff, cap: 0xffffff, shape: 'ball',
    size: 0.95, wide: 0.82, tall: 1.2,  anim: 0.8,  bob: 0.05, maxJumps: 3, gravity: 22, jumpPower: 10.5, laneSpeed: 11, prop: 'balloon' },
  { name: '자석이', desc: '작고 날쌤 · 옆 칸 동전도 끌어옴', color: 0xffc83c, cap: 0xd23c3c, shape: 'gem',
    size: 0.8,  wide: 1,    tall: 1,    anim: 1.5,  bob: 0.04, magnet: 2.6, jumpPower: 11, laneSpeed: 22, prop: 'magnet' },
  { name: '튼튼이', desc: '크고 묵직 · 에너지가 오래감',     color: 0x4fcf70, cap: 0x2a6b3c, shape: 'can',
    size: 1.3,  wide: 1.12, tall: 1,    anim: 0.75, bob: 0.02, drainScale: 0.6, hitScale: 0.6, gravity: 38, jumpPower: 12.2, laneSpeed: 10, prop: 'helmet' },
];
// 비주얼 테마: 주소 끝에 ?theme=이름 을 붙이거나 출발 전 화면 위쪽 버튼으로 바꿈
const THEMES = {
  basic:  { name: '기본',        skyTop: 0x8fd3ff, skyBottom: 0x8fd3ff, water: 0x3aa0e0, grassA: 0x6fcf5a, grassB: 0x5cbd4a, dirt: 0xb9814f,
            tree: 'cone',  trunk: 0x8a5a33, leaf: [0x3f9e4a], coin: 0xffd23c, box: 0xffa23c, enemy: 0x7a3cff },
  toy:    { name: '둥근 장난감', skyTop: 0x4fb4ff, skyBottom: 0xd9f3ff, water: 0x45c4f5, grassA: 0x9be65a, grassB: 0x86d946, dirt: 0xf5a85c,
            tree: 'round', trunk: 0xc98a4a, leaf: [0x43c46a, 0x6fd64e, 0x2fb38a], coin: 0xffdf3b, box: 0xff8a3c, enemy: 0x9a5cff },
  block:  { name: '블록',        skyTop: 0x7fd4ff, skyBottom: 0xb9ecff, water: 0x3f8fe0, grassA: 0x7ed957, grassB: 0x62bf45, dirt: 0x9c6b3f,
            tree: 'block', trunk: 0x7a5230, leaf: [0x3fa64a, 0x57bf52], coin: 0xffcf33, box: 0xe8a23c, enemy: 0x6a4cff, enemyBox: true, flat: true },
  pastel: { name: '파스텔',      skyTop: 0xf6b8d2, skyBottom: 0xfff0d9, water: 0xc4dcf5, grassA: 0x9fdcc4, grassB: 0x82c9ae, dirt: 0xe9aaa0,
            tree: 'thin',  trunk: 0xd9b8a8, leaf: [0x86bdb4, 0xa5cfc0, 0x6fa8a8], coin: 0xfff0a0, box: 0xf4b183, enemy: 0x6c6ea0, flat: true, light: 0.78 },
  candy:  { name: '과자 나라',   skyTop: 0xffa8d4, skyBottom: 0xfff2f8, water: 0xffb3d6, grassA: 0xffe3ef, grassB: 0xffb4d4, dirt: 0x8a4b2a,
            tree: 'lolli', trunk: 0xffffff, leaf: [0xff5fa2, 0xffd23c, 0x6fe0c0, 0xb07cff], coin: 0xffc83c, box: 0xff6fae, enemy: 0x5a2d82, light: 0.68 },
};
// 매직 아워: 둥근 장난감과 같은 세상에 해 질 녘 조명만 바꾼 것
//   sunPos = 해가 캐릭터 기준 어디에 있는지 [옆, 높이, 앞뒤(음수=앞쪽)]  낮을수록 그림자가 길어짐
THEMES.magic = { ...THEMES.toy, name: '매직 아워',
  skyTop: 0x2f3f8f, skyMid: 0xff7f86, skyBottom: 0xffc27a,
  hemiSky: 0xc9b8ff, hemiGround: 0xff9a6a, hemiI: 0.86, sunColor: 0xffa85a, sunI: 1.2, sunPos: [18, 12, -16],
  glowColor: 0xff9a4a, glowPos: [-22, 1.5], glowSize: 120, cloudTint: 0xffb9a0 };
// 별밤: 달빛과 별
THEMES.night = { ...THEMES.toy, name: '별밤',
  skyTop: 0x0a0f33, skyMid: 0x232c6b, skyBottom: 0x4656a6,
  hemiSky: 0x93a8ff, hemiGround: 0x3d4c80, hemiI: 0.8, sunColor: 0xcfe0ff, sunI: 0.75, sunPos: [-12, 16, -8],
  glowColor: 0xe6eeff, glowPos: [20, 14], glowSize: 24, cloudTint: 0x8e9ad8, stars: true };

/* ------------------------------------------------------------
   난이도 — 시작 화면에서 지형·악당·아이템 레벨을 1~100으로 고르고 출발
   (난이도를 정해 보는 시험 도구. 고른 숫자는 한 판 내내 그대로 적용됨)
   주소로도 지정: ?t=60&e=25&i=40&time=night   (t 지형 · e 악당 · i 아이템 · time 시간대)
   ------------------------------------------------------------ */
const LV_MAX = 100;
/* 레벨 숫자가 뜻하는 것 (1 → 100으로 갈수록)
   지형    큰 언덕·봉우리·물결이 섞여 나오고 높아짐(5→10미터), 구멍이 잦고 길어지고(3→8미터), 두 칸 구덩이와
           칸 바꾸기가 늘고, 물약이 드물어지고,
           10부터 점프해야 오르는 턱·절벽·담 · 20부터 허들 · 45부터 2단 점프 턱, 달리는 속도가 빨라짐(8→13).  25부터 징검다리(구멍-발판-구멍)
   악당    걸어오는 속도와 좌우로 오가는 속도가 빨라지고, 토막 끝의 덤 악당이 늘어남(30%→95%)
           1부터 슬라임·게 · 25부터 나는 벌 · 45부터 돌진하는 해골 · 65부터 벌이 옆 칸에 같이 나옴
   아이템  아래 표의 숫자 = 그 아이템이 상자에서 나오기 시작하는 레벨. 레벨이 오를수록 자석·번개가 오래감 */
const ITEM_UNLOCK = { grow: 1, coins: 1, heart: 11, magnet: 31, dash: 51 };
// 아이템: grow 커지기 · coins 동전 +10 · heart 에너지 +30 · magnet 자석 · dash 번개 질주(악당을 날리고 구덩이 위를 달림)
const TIMES = { day: ['낮', 'toy'], sunset: ['노을', 'magic'], night: ['별밤', 'night'] };   // 시간대: [이름, 테마]
const QUERY = new URLSearchParams(location.search);
// 스테이지: 지형·악당·아이템을 모두 그 레벨로 맞춘 판. 도착하면 다음 스테이지로 넘어감
const STAGES = [
  { name: '1 낮의 섬', lv: 20,  time: 'day' },
  { name: '2 노을 섬', lv: 60,  time: 'sunset' },
  { name: '3 별밤 섬', lv: 100, time: 'night' },
];
// 주소에 t·e·i 가 있으면 '직접 조절'(시험용), 없으면 스테이지 (?stage=2)
const CUSTOM = ['t', 'e', 'i'].some(q => QUERY.get(q));
const STAGE_NO = CUSTOM ? 0 : Math.max(1, Math.min(STAGES.length, Math.floor(+QUERY.get('stage')) || 1));
const lvOf = q => STAGE_NO ? STAGES[STAGE_NO - 1].lv : Math.max(1, Math.min(LV_MAX, Math.round(+QUERY.get(q)) || 1));
const LV = { terrain: lvOf('t'), enemy: lvOf('e'), item: lvOf('i') };
const TIME = STAGE_NO ? STAGES[STAGE_NO - 1].time : TIMES[QUERY.get('time')] ? QUERY.get('time') : 'day';
const U = { terrain: (LV.terrain - 1) / (LV_MAX - 1), enemy: (LV.enemy - 1) / (LV_MAX - 1), item: (LV.item - 1) / (LV_MAX - 1) };   // 레벨을 0~1로 바꾼 값
// 레벨이 오르면 세지는 배율: 에너지가 줄어드는 빠르기(1→1.5배) · 악당에게 맞는 피해(1→1.8배) · 구덩이에 빠지는 피해(1→1.8배)
const HARD = { drain: 1 + (U.terrain + U.enemy) / 4, enemyHit: 1 + U.enemy * 0.8, pitHit: 1 + U.terrain * 0.8 };
const STAGE = { theme: TIMES[TIME][1], speed: 8 + 5 * U.terrain,
  gen: { seed: LV.terrain * 131 + LV.enemy * 17 + LV.item * 7 + 1, length: 450, append: false } };   // length = 한 판의 길이(미터)
const THEME = THEMES[QUERY.get('theme')] || THEMES[STAGE.theme];
// 적: [거리, 칸 번호, 종류]  W=내 쪽으로 걸어옴  S=좌우 3칸을 오감(칸 번호는 무시)
const ENEMIES = [[14,1,'W'],[42,1,'W'],[56,0,'W'],[75,2,'W'],[96,1,'S'],[108,0,'W'],[127,1,'S'],[145,1,'W'],[174,1,'S']];

// 스테이지 자동 생성기 — 안전한 칸(동전 길)을 먼저 정하고 그 주변에 구덩이·악당·상자를 놓아서 항상 깰 수 있게 만듦
function genStage({ seed, length }, from) {            // from = 이어 붙일 때 시작 거리
  const t = U.terrain, e = U.enemy, E = LV.enemy, maxH = 5 + 5 * t, sp = STAGE.speed;
  let s = seed;
  const r = () => { s = s + 0x6D2B79F5 | 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  const pick = a => a[Math.floor(r() * a.length)];
  const level = from ? [] : [[14, 0]], pits = [], coinPath = from ? [] : [[4, 1]], boxes = [], potions = [], big = [], enemies = [], arcs = [], blocks = [], zones = [];
  let zone = 'rest', zLeft = 1;
  const addEnemy = (ed, el, type) => {                               // 악당끼리 겹치지 않게: 같은 칸 4미터, 다른 칸 2미터 안에는 안 놓음
    if (enemies.some(q => Math.abs(q[0] - ed) < (q[1] === el || type === 'S' || q[2] === 'S' ? 4 : 2))) return false;
    enemies.push([ed, el, type]); return true;
  };
  let d = from || 14, h = 0, lane = 1, sinceGap = 0, n = 0, lastPot = from || 0, endIdx = -1, afterBox = false, lastBox = from || 0;
  const enemyType = () => { const ty = ['W', 'W', 'S']; if (E >= 25) ty.push('F', 'F'); if (E >= 45) ty.push('C', 'C'); return pick(ty); };
  while (d < length - 24) {
    n++;
    if (zLeft-- <= 0) {                                              // 구간 바꾸기: 지형 구간 / 악당 구간 / 섞인 구간 / 쉬는 구간
      zone = pick(['terrain', 'enemy', 'mix', 'rest'].filter(z => z !== zone && !(z === 'rest' && n < 6)));
      zLeft = zone === 'rest' ? 1 : 3 + Math.floor(r() * 2);
      zones.push([d, zone]);
    }
    const ZT = zone === 'terrain', ZE = zone === 'enemy', ZR = zone === 'rest', calm = ZE || ZR;
    const zm = ZT ? 0.15 : ZE ? 1.4 : ZR ? 0 : 1;                    // 구간별 덤 악당 배율
    if (!calm && r() < (0.12 + 0.16 * t) * (ZT ? 2 : 1) && sinceGap > (ZT ? 9 : 16)) {                    // 3칸 전체 구멍 (+ 착지할 땅)

  boxes.forEach(b => { b.used = false; b.mesh.material = boxMatNew; });
  item.active = false; itemMesh.visible = false;
  state = 'ready'; setMsg(startText);
}
function respawn() {               // 근처의 안전한 칸에서 다시

  search: for (; d >= 0; d -= 1) for (const l of [p.lane, 1, 0, 2])
    if (groundLane(d, l) !== null && groundLane(d + 3, l) !== null) { lane = l; break search; }
  d = Math.max(d, 0);
  Object.assign(p, { d, lane, x: (lane - 1) * LW, y: groundLane(d, lane) || 0, vy: 0, jumps: 0, onGround: true, prevLane: lane });

}
function fail() {
  SFX.fall();
  if (p.big) { p.big = false; state = 'hurt'; timer = 0.9; setMsg('작아졌어요!\n<small>에너지는 그대로</small>'); return; }
  if (loseEnergy(CONFIG.pitCost * HARD.pitHit)) gameOver();
  else { state = 'hurt'; timer = 0.9; setMsg('아이쿠!\n<small>에너지가 깎였어요</small>'); }
}
function hitEnemy() {              // 적에게 닿음: 멈추지 않고 깜빡이며 계속 달림
  p.inv = CONFIG.hitSafeTime; msgT = 0.9; SFX.hit();
  if (p.big) { p.big = false; setMsg('작아졌어요!'); return; }
  if (loseEnergy(CONFIG.enemyCost * HARD.enemyHit)) gameOver();

function start() { if (state === 'ready') { audioInit(); state = 'play'; setMsg(''); $pick.style.display = 'none'; $themes.style.display = 'none'; return true; } return false; }
function jump() {
  if (start() || state !== 'play') return;
  if (p.jumps < (ch().maxJumps || CONFIG.maxJumps)) {
    p.vy = (ch().jumpPower || CONFIG.jumpPower) * (p.jumps === 0 ? 1 : 0.9);

function moveLane(dir) {

}
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'KeyM') { audioInit(); setSound(!SND.on); return; }
  if (state === 'ready' && /^Digit[1-4]$/.test(e.code)) { setChar(+e.code.slice(5) - 1); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); jump(); }
  else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); moveLane(-1); }
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); moveLane(1); }
});
// 터치·마우스: 좌우로 밀면 옆 칸, 짧게 누르면 점프
let touch = null;
addEventListener('pointerdown', e => { e.preventDefault(); touch = { x: e.clientX, y: e.clientY, used: false }; });
addEventListener('pointermove', e => {
  if (!touch) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) { moveLane(dx > 0 ? 1 : -1); touch.x = e.clientX; touch.y = e.clientY; touch.used = true; }

addEventListener('pointerup', () => { if (touch && !touch.used) jump(); touch = null; });
addEventListener('pointercancel', () => { touch = null; });

function update(dt) {
  if (state === 'hurt') { timer -= dt; if (timer <= 0) respawn(); return; }
  if (state === 'over') { timer -= dt; if (timer <= 0) reset(); return; }
  if (state === 'goal') {                                              // 도착: 결과를 잠깐 보여주고 같은 설정으로 다시
    timer -= dt;
    if (timer <= 0) { if (STAGE_NO) { state = 'leaving'; location.search = stageUrl(STAGE_NO < STAGES.length ? STAGE_NO + 1 : 1); } else reset(); }
    return;
  }
  if (state !== 'play') return;

  energy -= CONFIG.drain * HARD.drain * (ch().drainScale || 1) * dt;                // 시간이 지나면 에너지가 줄어듦
  if (energy <= 0) { gameOver(); return; }
  if (p.magT > 0) p.magT -= dt;
  if (p.dashT > 0) p.dashT -= dt;
  p.d += CONFIG.speed * (p.dashT > 0 ? 1.7 : 1) * dt;
  const tx = (p.lane - 1) * LW, mx = (ch().laneSpeed || CONFIG.laneSpeed) * dt;
  p.x += Math.max(-mx, Math.min(mx, tx - p.x));
  let lane = curLane(), g = groundLane(p.d, lane);
  if (g !== null && g > p.y + CONFIG.stepUp && lane !== p.prevLane) {   // 옆에서 담에 부딪힘: 다치지 않고 원래 칸으로 튕겨 나옴
    const back = groundLane(p.d, p.prevLane);
    if (back === null || back <= p.y + CONFIG.stepUp) {
      p.x = (p.prevLane - 1) * LW + (lane - p.prevLane) * (LW / 2 - 0.06); p.lane = p.prevLane; lane = p.prevLane; g = back; SFX.box();
    }
  }
  p.prevLane = lane;
  if (p.dashT > 0 && g === null) { const th = terrainH(p.d); g = th === null ? p.y : th; }   // 번개 질주: 구덩이·구멍 위를 달림
  if (g !== null && g > p.y + CONFIG.stepUp) { fail(); return; }      // 벽에 부딪힘

  if (p.onGround && g !== null && g >= p.y - 0.6) {
    p.y = g; p.vy = 0;                                                 // 언덕을 따라 달림
  } else {
    p.vy -= (ch().gravity || CONFIG.gravity) * dt;
    p.y += p.vy * dt;
    if (g !== null && p.y <= g) {
      if (p.vy < -4) p.squash = 0.3;                                   // 착지 찌부
      p.y = g; p.vy = 0; p.onGround = true; p.jumps = 0;
    } else p.onGround = false;
  }
  if (p.onGround) safeD = p.d;
  if (p.y < -6) { fail(); return; }                                    // 구덩이에 빠짐

  // 상자: 밑에서 머리로 쿵
  for (const b of boxes) {
    if (b.lane !== lane || Math.abs(b.d - p.d) > 0.75 || p.vy <= 0) continue;
    if (p.y + heroH() >= b.bottom && p.y < b.bottom) {
      p.y = b.bottom - heroH(); p.vy = -3; b.bump = 0.25; SFX.box();
      if (!b.used) {
        b.used = true; b.mesh.material = boxMatUsed;
        const loot = Object.keys(ITEM_UNLOCK).filter(k => ITEM_UNLOCK[k] <= LV.item);
        Object.assign(item, { active: true, kind: loot[Math.floor(Math.random() * loot.length)], d: b.d, lane: b.lane, y: b.bottom + 1.3, vy: 5, vd: CONFIG.speed + 2.5 });   // 낮게 튀어나와 가까이 떨어짐
      }
    }
  }
  // 아이템: 앞으로 날아가 떨어진 뒤 천천히 굴러감
  if (item.active) {
    item.d += item.vd * dt; item.vy -= CONFIG.gravity * dt; item.y += item.vy * dt;
    const ig = groundLane(item.d, item.lane);
    if (ig !== null && item.y <= ig + 0.5 && item.y > ig - 0.8) { item.y = ig + 0.5; item.vy = 0; item.vd = 1.5; }
    if (item.y < -6 || item.d < p.d - 6) item.active = false;
    if (Math.abs(item.d - p.d) < 0.9 && item.lane === lane && Math.abs(item.y - (p.y + 0.5)) < 1.3) {
      item.active = false; p.squash = -0.35; msgT = 1.2; SFX.item();
      if (item.kind === 'grow') { if (p.big) coinCount += 5; else p.big = true; setMsg('<small>쑥쑥! 몸이 커졌어요</small>'); }
      else if (item.kind === 'heart') { energy = Math.min(CONFIG.energyMax, energy + 30); setMsg('<small>에너지 +30</small>'); }
      else if (item.kind === 'coins') { coinCount += 10; setMsg('<small>동전 +10</small>'); }
      else if (item.kind === 'magnet') { p.magT = 6 + U.item * 6; setMsg('<small>자석! 동전이 끌려와요</small>'); }
      else { p.dashT = 3.5 + U.item * 3; setMsg('<small>번개 질주!</small>'); }
    }
  }

  // 적: 위에서 밟으면 처치, 옆에서 닿으면 다침
  if (p.inv > 0) p.inv -= dt;
  if (msgT > 0 && (msgT -= dt) <= 0) setMsg('');
  for (const e of enemies) {
    if (e.dead) continue;
    if (Math.abs(e.d - p.d) < 35) {
      if (e.type === 'S') { e.t += dt * e.sf; e.x = Math.sin(e.t * (1.4 + U.enemy * 2.4)) * LW; }           // 게: 좌우로 오감

        const nd = e.d + e.dir * sp * e.sf * dt;
        const gn = groundLane(nd + e.dir * 0.6, e.lane), gc = groundLane(e.d, e.lane);

      }
    }
    e.y = ((e.type === 'S' ? terrainH(e.d) : groundLane(e.d, e.lane)) || terrainH(e.d) || 0) + (e.type === 'F' ? 1.7 : 0);            // 벌은 머리 높이에 떠 있음
    if (Math.abs(e.d - p.d) < 1.0 && Math.abs(e.x - p.x) < 1.0) {
      if (!p.onGround && p.y >= e.y + (0.15 + 0.4 * U.enemy) * e.sc && p.y <= e.y + 1.3 * e.sc + 0.3) {       // 밟기: 낮은 레벨은 공중에서 닿기만 해도, 높은 레벨은 확실히 위에서
        e.dead = true; e.deadT = 0.3; coinCount += 2;
        SFX.stomp(); energy = Math.min(CONFIG.energyMax, energy + CONFIG.stompGain * e.sc);   // 밟으면 에너지가 조금 참 (큰 악당일수록 더)
        p.vy = CONFIG.jumpPower * CONFIG.stompBounce; p.jumps = 1; p.onGround = false; p.squash = -0.25;
      } else if (p.y < e.y + 0.8 * e.sc && p.y + heroH() > e.y + 0.1) {         // 몸이 겹칠 때만 (벌 밑으로는 지나감)
        if (p.dashT > 0) { e.dead = true; e.deadT = 0.3; coinCount += 2; SFX.stomp(); }   // 번개 질주 중에는 악당을 날려버림
        else if (p.inv <= 0) { hitEnemy(); if (state !== 'play') return; }
      }
    }
  }

  for (const k of pickups) {
    if (k.got || Math.abs(k.d - p.d) > 0.9 || Math.abs(k.x - p.x) > 1.0 || Math.abs(k.y - (p.y + 0.5)) > 1.2) continue;
    k.got = true; k.g.visible = false;

  }
  const mag = p.magT > 0 ? 5 : (ch().magnet || 0.9);                   // 자석이는 옆 칸, 자석 아이템은 3칸 전부
  for (const c of coins) {
    if (!c.got && Math.abs(c.d - p.d) < (mag > 4 ? 2.6 : mag > 1 ? 1.4 : 0.8) && Math.abs(c.x - p.x) < mag && Math.abs(c.y - (p.y + 0.5)) < (mag > 4 ? 3 : mag > 1 ? 1.6 : 1.0)) {
      c.got = true; coinCount++; SFX.coin();
      if (mag > 1 && (Math.abs(c.x - p.x) > 0.9 || Math.abs(c.d - p.d) > 0.8)) c.fly = 0.24;   // 멀리서 끌려온 동전은 날아오는 모습을 보여줌
      else c.g.visible = false;
    }
  }
  if (p.d >= total - 6) { state = 'goal'; timer = 3.5; SFX.goal(); setMsg((STAGE_NO === STAGES.length ? '모든 스테이지 완료!' : '도착!') + '\n<small>' + (STAGE_NO && STAGE_NO < STAGES.length ? '다음: 스테이지 ' + STAGES[STAGE_NO].name + '\n' : '') + '지형 ' + LV.terrain + ' · 악당 ' + LV.enemy + ' · 아이템 ' + LV.item + '\n동전 ' + coinCount + '개 · 별 동전 ' + '★'.repeat(stars) + '☆'.repeat(BIG_COINS.length - stars) + ' · 남은 에너지 ' + Math.round(energy) + '</small>'); }
}

function draw(dt, t) {
  p.squash += (0 - p.squash) * Math.min(1, dt * 12);
  p.size += ((p.big ? CONFIG.bigScale : 1) - p.size) * Math.min(1, dt * 10);
  const cz = ch(), sz = p.size * (cz.size || 1);                         // 캐릭터마다 크기·비율·통통 튀는 정도가 다름
  const bob = p.onGround && state === 'play' ? Math.abs(Math.sin(t * 9 * (cz.anim || 1))) * (cz.bob || 0) : 0;
  hero.position.set(p.x, Math.max(p.y, -6) + bob, -p.d);
  hero.scale.set(sz * (cz.wide || 1) * (1 + p.squash), sz * (cz.tall || 1) * (1 - p.squash), sz * (cz.wide || 1) * (1 + p.squash));
  hero.rotation.x = p.onGround ? 0 : hero.rotation.x - dt * 7 * (p.jumps > 1 ? 1 : 0);
  hero.rotation.z = ((p.lane - 1) * LW - p.x) * -0.25;                 // 옆으로 갈 때 살짝 기울기
  hero.visible = (state !== 'hurt' && p.inv <= 0) || Math.floor(t * 12) % 2 === 0;
  for (const e of enemies) {
    if (e.dead) { e.deadT -= dt; e.g.scale.set(1.3 * e.sc, 0.2 * e.sc, 1.3 * e.sc); e.g.visible = e.deadT > 0; }
    e.g.position.set(e.x, e.y + (e.dead ? 0 : Math.abs(Math.sin(t * 6 + e.d0)) * 0.12), -e.d);
  }

  const g = groundLane(p.d, curLane());
  shadow.visible = g !== null && p.y >= g - 0.01;
  if (shadow.visible) {
    shadow.position.set(p.x, g + 0.08, -p.d);
    const k = p.size * Math.max(0.45, 1 - (p.y - g) * 0.18); shadow.scale.set(k, k, k);
  }
  for (const c of coins) {
    if (!c.g.visible) continue;
    c.g.rotation.y = t * (c.fly > 0 ? 14 : 3) + c.d;
    if (c.fly > 0) {                                                   // 자석에 끌려 캐릭터에게 날아오며 작아짐
      c.fly -= dt;
      const k = Math.min(1, dt / Math.max(c.fly, 0.016)), q = c.g.position;
      q.x += (p.x - q.x) * k; q.y += (p.y + 0.6 - q.y) * k; q.z += (-p.d - q.z) * k;
      c.g.scale.setScalar(0.45 + Math.max(c.fly, 0) * 2.3);
      if (c.fly <= 0) c.g.visible = false;
    }
  }
  for (const mx of mixers) mx.update(dt);
  if (heroActs) {                                                      // 달리기·점프·대기 동작 바꾸기
    const want = state === 'ready' ? 'idle' : p.onGround ? 'run' : 'jump';
    if (heroAct !== want) {
      heroActs[want].reset().fadeIn(0.12).play();
      if (heroAct) heroActs[heroAct].fadeOut(0.12);
      heroAct = want;
    }
  }
  for (const b of boxes) { b.bump = Math.max(0, b.bump - dt); if (b.model) b.model.scale.setScalar(b.used ? 0.75 : 1); b.mesh.position.y = b.bottom + 0.55 + Math.sin(b.bump / 0.25 * Math.PI) * 0.35; }
  itemMesh.visible = item.active;
  for (const k in itemVis) itemVis[k].visible = k === item.kind;
  itemMesh.material.visible = !itemVis[item.kind];
  $buff.textContent = (p.magT > 0 ? '자석 ' + Math.ceil(p.magT) + '초  ' : '') + (p.dashT > 0 ? '번개 질주 ' + Math.ceil(p.dashT) + '초' : '');
  if (item.active) { itemMesh.position.set((item.lane - 1) * LW, item.y, -item.d); itemMesh.rotation.y = t * 4; }

  const ahead = terrainH(p.d + 8), py = Math.max(p.y, 0);                // 앞에 언덕이 있으면 카메라가 미리 올라가 너머가 보이게 함
  camY += ((ahead !== null && ahead > py ? (py + ahead) / 2 + 0.6 : py) - camY) * Math.min(1, dt * 4);
  camera.position.set(p.x * 0.5, camY + CONFIG.camUp, -p.d + CONFIG.camBack);
  camera.lookAt(p.x * 0.3, camY + 1.2, -(p.d + CONFIG.camLookAhead));
  sun.target.position.set(0, camY, -p.d - 8);                         // 햇빛과 그림자 영역이 캐릭터를 따라감
  sun.position.set(SUN_POS[0], camY + SUN_POS[1], -p.d - 8 + SUN_POS[2]);
  if (starsPts) starsPts.position.copy(camera.position);
  glow.position.set(camera.position.x + GLOW_POS[0], camera.position.y + GLOW_POS[1], camera.position.z - 85);

  for (const k of pickups) if (k.g.visible) k.g.rotation.y = t * 2 + k.d;
  $coins.textContent = '동전 ' + coinCount + ' ' + '★'.repeat(stars) + '☆'.repeat(BIG_COINS.length - stars);
  const ratio = Math.max(0, energy) / CONFIG.energyMax;
  $fill.style.width = (ratio * 100) + '%';
  $fill.style.background = ratio < 0.25 ? '#ff3b3b' : ratio < 0.5 ? '#ffb03b' : '#4fdc7a';
  let zn = ''; for (const [zd, z] of ZONES) if (p.d >= zd) zn = ZONE_NAME[z];
  $prog.textContent = (zn ? zn + ' · ' : '') + Math.min(100, Math.round(p.d / (total - 6) * 100)) + '%';
  renderer.render(scene, camera);
}

/* ============================================================
   4) 모델 입히기 — models 폴더의 파일을 불러와 도형과 바꿔 끼움
      주소 끝에 ?models=0 을 붙이면 도형 그대로 달림
      (모델: 쿼터니어스 플랫포머 묶음, 저작권 표시 없이 쓸 수 있는 조건)
   ============================================================ */
const MODELS     = { hero: 'character', enemyW: 'enemy_slime', enemyS: 'enemy_crab', enemyF: 'enemy_bee', enemyC: 'enemy_skull',
                     coin: 'coin', star: 'star', potion: 'heart', item: 'fruit', dash: 'thunder', box: 'cube_item', tree: 'tree', cloud: 'cloud' };
const MODEL_SIZE = { hero: 1.25, enemyW: 0.95, enemyS: 0.95, enemyF: 0.85, enemyC: 1.0, coin: 0.75, star: 1.4,
                     potion: 0.8, item: 0.9, dash: 1.0, box: 1.1, tree: 5.5, cloud: 2.4 };   // 키(높이)
if (THREE.GLTFLoader && new URLSearchParams(location.search).get('models') !== '0') {
  const loader = new THREE.GLTFLoader(), fixed = new Set();
  const load = key => new Promise((res, rej) => loader.load('models/' + MODELS[key] + '.glb', res, undefined, rej));
  const prep = (root, cast = true) => root.traverse(o => {             // 재질을 게임 조명에 맞게 손봄
    if (!o.isMesh) return; o.frustumCulled = false; o.castShadow = cast;
    for (const m of [].concat(o.material)) if (!fixed.has(m)) { fixed.add(m); m.metalness = 0; m.roughness = 0.9; m.color.convertLinearToSRGB(); m.emissive.copy(m.color).multiplyScalar(0.28); }
  });
  const fit = (obj, h, center) => {                                    // 키를 맞추고 발바닥(또는 가운데)을 기준점으로
    const w = new THREE.Group(); w.add(obj); obj.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(obj), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    const k = h / s.y; obj.scale.multiplyScalar(k);
    obj.position.set(-c.x * k, (center ? -c.y : -b.min.y) * k, -c.z * k);
    return w;
  };
  const warn = e => console.warn('모델을 못 불러와 도형으로 달립니다', e);

  load('hero').then(g => {
    prep(g.scene);
    g.scene.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) if (!heroMats.some(x => x.m === m)) heroMats.push({ m, c: m.color.clone() }); });
    const m = fit(g.scene, MODEL_SIZE.hero); m.rotation.y = Math.PI; hero.add(m); heroModel = m;
    const mx = new THREE.AnimationMixer(g.scene); mixers.push(mx); heroMixer = mx;
    const act = n => mx.clipAction(g.animations.find(a => a.name.endsWith('|' + n)));
    heroActs = { run: act('Run'), jump: act('Jump_Idle'), idle: act('Idle') };
    setChar(charIdx);
  }).catch(warn);

  for (const [key, type] of [['enemyW', 'W'], ['enemyS', 'S'], ['enemyF', 'F'], ['enemyC', 'C']]) if (enemies.some(e => e.type === type)) load(key).then(g => {
    prep(g.scene);
    const walk = g.animations.find(a => /\|(Walk|Flying)$/.test(a.name));
    for (const e of enemies) if (e.type === type) {
      const c = THREE.SkeletonUtils.clone(g.scene);
      e.g.children.forEach(k => k.visible = false); e.g.add(fit(c, MODEL_SIZE[key]));
      const mx = new THREE.AnimationMixer(c); mixers.push(mx); if (walk) mx.clipAction(walk).play();
    }
  }).catch(warn);

  const still = (key, use) => load(key).then(g => { prep(g.scene, key === 'tree' || key === 'box'); use(center => fit(g.scene.clone(), MODEL_SIZE[key], center)); }).catch(warn);
  still('coin', mk => coins.forEach(c => { c.g.children[0].visible = false; c.g.add(mk(true)); }));
  for (const [key, kind] of [['star', 'star'], ['potion', 'potion']])
    still(key, mk => pickups.forEach(k => { if (k.kind !== kind) return; k.g.children.forEach(x => x.visible = false); k.g.add(mk(true)); }));
  for (const [key, kind] of [['item', 'grow'], ['potion', 'heart'], ['dash', 'dash'], ['coin', 'coins']])
    still(key, mk => { const m = mk(true); m.scale.setScalar(1.25); itemVis[kind] = m; itemMesh.add(m); });
  still('box', mk => { boxMatNew.visible = boxMatUsed.visible = false; boxes.forEach(b => { b.model = mk(true); b.mesh.add(b.model); }); });
  still('tree', mk => { treeGroup.visible = false; treeSpots.forEach(t => { const m = mk(); m.scale.setScalar(0.45 + t.sc * 0.2); m.rotation.y = t.x * 3; m.position.set(t.x, t.y - 0.05, t.z); scene.add(m); }); });
  still('cloud', mk => {
    if (THEME.cloudTint) mk(true).traverse(k => {    // 구름 재질은 모두 함께 쓰므로 한 번만 물들이면 됨
      if (k.isMesh) for (const m of [].concat(k.material)) { m.color.set(THEME.cloudTint); m.emissive.copy(m.color).multiplyScalar(0.3); }
    });
    const nUp = Math.round(total / 13), nDown = Math.round(total / 3.2);
    for (let i = 0; i < nUp; i++) {                  // 옆 하늘에 떠 있는 구름
      const m = mk(true); m.scale.setScalar(1 + (i % 3) * 0.5);
      m.position.set((i % 2 ? 1 : -1) * (13 + (i * 37 % 17)), 5 + (i * 13 % 8), -(i / nUp) * (total + 30)); scene.add(m);
    }
    for (let i = 0; i < nDown; i++) {                // 섬 아래로 깔린 구름 바다 — 높이 떠 있는 느낌
      const m = mk(true); m.scale.setScalar(2.2 + (i % 4) * 0.9);
      m.position.set(((i * 53) % 90) - 45, -CONFIG.islandDepth - 4 - (i * 7 % 6), 20 - (i / nDown) * (total + 80)); scene.add(m);
    }
  });
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  update(dt); draw(dt, now / 1000);
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
